# ── Production Profile ────────────────────────────────────
# Activated via the environment variable SPRING_PROFILES_ACTIVE=prod

spring.datasource.url=${SEVAK_DB_URL}
spring.datasource.username=${SEVAK_DB_USER}
spring.datasource.password=${SEVAK_DB_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET search_path = sevak
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.connection-timeout=10000

server.port=${PORT:8080}


# ── Flyway: if the schema already exists without Flyway's history table, treat it as V1 ──
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ── JSON logs in production ───────────────────────────────
logging.structured.format.console=ecs

# ── No defaults on purpose: production must not start without these ──
sevak.jwt.secret=${SEVAK_JWT_SECRET}
sevak.cors.allowed-origins=${SEVAK_CORS_ORIGINS}

# ── Use the real client IP for rate limiting behind the platform's proxy ──
server.forward-headers-strategy=framework

# ── Reset the public demo every night at 03:00 IST ───────
sevak.demo.reset-cron=0 0 3 * * *
