# ── Production Profile ────────────────────────────────────
# Activated via the environment variable SPRING_PROFILES_ACTIVE=prod

spring.datasource.url=${SEVAK_DB_URL}
spring.datasource.username=${SEVAK_DB_USER}
spring.datasource.password=${SEVAK_DB_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET search_path = sevak
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.connection-timeout=10000

server.port=${PORT:8080}

# ── Write-endpoint API key (temporary, until JWT auth in Phase 4) ──
# No default on purpose: production must fail to start if SEVAK_ADMIN_KEY is missing,
# instead of silently falling back to the public dev key from application.properties.
sevak.admin-key=${SEVAK_ADMIN_KEY}

# ── Flyway: if the schema already exists without Flyway's history table, treat it as V1 ──
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
