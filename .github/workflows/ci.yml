name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and check formatting
        working-directory: api
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: api/target/site/jacoco/
          if-no-files-found: ignore

      - name: Build Docker image
        run: docker build -t sevak-api api

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sevak_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_PASSWORD: ci-only
      # The end-to-end tests log in more often than a person would.
      SEVAK_RATE_LIMIT_STRICT_PER_MINUTE: 100000
      SEVAK_RATE_LIMIT_GENERAL_PER_MINUTE: 100000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Start the API
        working-directory: api
        run: |
          ./mvnw -B -q -DskipTests package
          nohup java -jar target/sevak-api-*.jar > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health/readiness && exit 0
            sleep 2
          done
          cat api.log
          exit 1

      - name: Install
        working-directory: web
        run: npm ci

      - name: Fail if the generated API types are out of date
        working-directory: web
        run: |
          npm run api:sync
          git diff --exit-code -- openapi.json src/api/schema.d.ts

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Install the browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: web
        run: npx playwright test

      - name: Upload end-to-end report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
