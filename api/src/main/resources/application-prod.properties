# ── Production Profile ────────────────────────────────────
# Activated via the environment variable SPRING_PROFILES_ACTIVE=prod

spring.datasource.url=${SEVAK_DB_URL}
# The API's requests: the sevak_app role, under row-level security. The app refuses to start
# if this login is a superuser, can bypass row-level security, or owns the tables.
spring.datasource.username=${SEVAK_DB_USER}
spring.datasource.password=${SEVAK_APP_DB_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET search_path = sevak
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.connection-timeout=10000

# The owner, for Flyway and the maintenance jobs. It must be a superuser or have BYPASSRLS:
# the tables use FORCE ROW LEVEL SECURITY, so an ordinary owner would be filtered too.
# Flyway needs a session connection; a transaction pooler breaks its locks.
spring.flyway.url=${SEVAK_OWNER_DB_URL}
spring.flyway.user=${SEVAK_OWNER_DB_USER}
spring.flyway.password=${SEVAK_OWNER_DB_PASSWORD}
sevak.owner-db.hikari.data-source-properties.sslmode=require

server.port=${PORT:8080}


# ── Flyway: if the schema already exists without Flyway's history table, treat it as V1 ──
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ── JSON logs in production ───────────────────────────────
logging.structured.format.console=ecs

# ── No defaults on purpose: production must not start without these ──
sevak.jwt.secret=${SEVAK_JWT_SECRET}
sevak.cors.allowed-origins=${SEVAK_CORS_ORIGINS}

# ── Use the real client IP for rate limiting behind the platform's proxy ──
server.forward-headers-strategy=framework

# ── Reset the public demo every night at 03:00 IST ───────
sevak.demo.reset-cron=0 0 3 * * *
