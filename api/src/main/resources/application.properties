spring.application.name=sevak-api

# ── Database ──────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/sevak_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:changeme}

# ── Set schema search path ────────────────────────────────
spring.datasource.hikari.connection-init-sql=SET search_path = sevak


# ── Swagger / OpenAPI ─────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha

# ── Flyway (database migrations) ─────────────────────────
# db/seed holds the demo data, loaded in every environment because this is a demo project.
spring.flyway.schemas=sevak
spring.flyway.default-schema=sevak
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# ── Actuator ─────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never

# ── Queries and logging ──────────────────────────────────
spring.jdbc.template.query-timeout=5s
logging.pattern.level=%5p [%X{requestId:-}]

# ── How often the materialized views are refreshed ───────
sevak.views.refresh-interval=PT15M

# ── Login tokens (the dev secret must never be used in production) ──
sevak.jwt.secret=${SEVAK_JWT_SECRET:dev-only-secret-change-me-before-any-deployment}
sevak.jwt.validity=PT24H

# ── Which browser origins may call the API ───────────────
sevak.cors.allowed-origins=http://localhost:5173

# ── Requests per minute, per IP address ──────────────────
sevak.rate-limit.strict-per-minute=10
sevak.rate-limit.general-per-minute=300

# ── Scheduled jobs ───────────────────────────────────────
sevak.bookings.expiry-interval=PT15M
# "-" turns the nightly demo reset off.
sevak.demo.reset-cron=-
