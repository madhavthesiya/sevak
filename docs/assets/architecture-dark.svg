<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img"><title>How SEVAK connects</title><rect x="0" y="20" width="190" height="150" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="16" y="46" fill="#f0f6fc" font-size="14" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Web app</text><text x="16" y="64" fill="#9198a1" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">React · Vercel</text><circle cx="20" cy="86" r="2.5" fill="#9198a1"/><text x="30" y="90" fill="#f0f6fc" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Generated API types</text><circle cx="20" cy="106" r="2.5" fill="#9198a1"/><text x="30" y="110" fill="#f0f6fc" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">“Show the SQL” drawer</text><circle cx="20" cy="126" r="2.5" fill="#9198a1"/><text x="30" y="130" fill="#f0f6fc" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">One-click demo logins</text><rect x="300" y="20" width="250" height="150" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="316" y="46" fill="#f0f6fc" font-size="14" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">API</text><text x="316" y="64" fill="#9198a1" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Spring Boot · Render</text><circle cx="320" cy="86" r="2.5" fill="#9198a1"/><text x="330" y="90" fill="#f0f6fc" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Rate limit → JWT → services</text><circle cx="320" cy="106" r="2.5" fill="#9198a1"/><text x="330" y="110" fill="#f0f6fc" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Hand-written SQL (JdbcClient)</text><circle cx="320" cy="126" r="2.5" fill="#9198a1"/><text x="330" y="130" fill="#f0f6fc" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Each transaction sets the caller</text><rect x="660" y="20" width="220" height="310" rx="10" fill="#12352a" stroke="#3fb983" stroke-width="1.5"/><text x="676" y="46" fill="#f0f6fc" font-size="14" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">PostgreSQL</text><text x="676" y="64" fill="#9198a1" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Supabase · Singapore</text><circle cx="680" cy="86" r="2.5" fill="#3fb983"/><text x="690" y="90" fill="#f0f6fc" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Row-level security, 16 tables</text><circle cx="680" cy="106" r="2.5" fill="#3fb983"/><text x="690" y="110" fill="#f0f6fc" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Exclusion constraint</text><circle cx="680" cy="126" r="2.5" fill="#3fb983"/><text x="690" y="130" fill="#f0f6fc" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Status rules as data</text><circle cx="680" cy="146" r="2.5" fill="#3fb983"/><text x="690" y="150" fill="#f0f6fc" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Deferred subtotal check</text><circle cx="680" cy="166" r="2.5" fill="#3fb983"/><text x="690" y="170" fill="#f0f6fc" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Materialized views</text><circle cx="680" cy="186" r="2.5" fill="#3fb983"/><text x="690" y="190" fill="#f0f6fc" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">SECURITY DEFINER windows</text><rect x="300" y="220" width="250" height="110" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="316" y="246" fill="#f0f6fc" font-size="14" font-weight="650" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Owner work</text><text x="316" y="264" fill="#9198a1" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Flyway and two jobs</text><circle cx="320" cy="286" r="2.5" fill="#9198a1"/><text x="330" y="290" fill="#f0f6fc" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Migrations, demo reset</text><circle cx="320" cy="306" r="2.5" fill="#9198a1"/><text x="330" y="310" fill="#f0f6fc" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Refresh the stored summaries</text><defs><marker id="a1929529795" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker></defs><line x1="192" y1="95" x2="297" y2="9